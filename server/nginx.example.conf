# Vi du cau hinh Nginx cho ban do so.
# - Static file build (`dist/`) duoc phuc vu truc tiep.
# - Cac request /api/* duoc chuyen toi BFF proxy (server/index.mjs, npm run server)
#   dang chay tren localhost:8787 (PM2/systemd tu quan ly process nay).
#   BFF giu token Directus va Basic-auth tile phia server, khong bao gio gui ve trinh duyet.

server {
    listen 80;
    server_name ban-do-so.hue.gov.vn; # doi thanh domain that

    root /var/www/bandoso/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback cho React Router / route /statics, /dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }
}
